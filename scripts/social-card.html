<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frame social card source</title>
    <link rel="stylesheet" href="/social-card.css" />
  </head>
  <body>
    <main>
      <div class="glow" aria-hidden="true"></div>
      <div class="brand"><img src="/icon.png" width="44" height="44" alt="" />Frame</div>
      <h1>Tiling Window Manager<br />for macOS</h1>
      <p class="description">Keyboard-first <span>·</span> Vim-inspired</p>
      <div class="displays" aria-hidden="true">
        <div class="monitor">
          <div class="screen two-columns">
            <div class="window reading">
              <div class="titlebar"><i></i><i></i><i></i></div>
              <div class="content">
                <b></b>
                <div class="lines"><i></i><i></i><i></i></div>
                <div class="block"></div>
                <div class="lines"><i></i><i></i></div>
              </div>
            </div>
            <div class="column-stack">
              <div class="window notes">
                <div class="titlebar"><i></i><i></i><i></i></div>
                <div class="content">
                  <b></b>
                  <div class="notes-list"><i></i><i></i><i></i></div>
                </div>
              </div>
              <div class="window">
                <div class="titlebar"><i></i><i></i><i></i></div>
                <div class="content">
                  <b></b>
                  <div class="lines"><i></i><i></i><i></i></div>
                </div>
              </div>
            </div>
          </div>
          <img class="hardware" src="/monitor-shell.webp" width="1400" height="960" alt="" />
        </div>
        <div class="monitor">
          <div class="screen two-columns">
            <div class="column-stack">
              <div class="window">
                <div class="titlebar"><i></i><i></i><i></i></div>
                <div class="content">
                  <b></b>
                  <div class="lines"><i></i><i></i><i></i></div>
                </div>
              </div>
              <div class="window notes">
                <div class="titlebar"><i></i><i></i><i></i></div>
                <div class="content">
                  <b></b>
                  <div class="notes-list"><i></i><i></i></div>
                </div>
              </div>
            </div>
            <div class="window editor focused">
              <div class="titlebar"><i></i><i></i><i></i></div>
              <div class="content">
                <b></b>
                <div class="code"><i></i><i></i><i></i><i></i><i></i><i></i></div>
              </div>
            </div>
          </div>
          <img class="hardware" src="/monitor-shell.webp" width="1400" height="960" alt="" />
        </div>
      </div>
    </main>
  </body>
</html>
